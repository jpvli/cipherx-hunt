<html lang="en">
<head>
<meta charset="UTF-8">

<title>Case File FIN-014 — Internal Hunt</title>
<style>
  :root{
    --bg:#10141A;
    --panel:#171C24;
    --panel-2:#1D232C;
    --line:#2A313D;
    --text:#E7EAEE;
    --muted:#8993A3;
    --amber:#E0A24B;
    --amber-dim:#5A4326;
    --teal:#4FB0A5;
    --teal-dim:#1F3B37;
    --red:#D9614F;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:28px;min-height:100vh;}
  .wrap{max-width:1220px;margin:0 auto;}

  header{
    border-bottom:1px solid var(--line);
    padding-bottom:18px;margin-bottom:22px;
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
  }
  header .id{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0.02em;}
  header h1{font-size:22px;font-weight:600;margin:4px 0 0 0;}
  header .right{display:flex;align-items:center;gap:12px;}
  header .progress{font-family:var(--mono);font-size:12px;color:var(--muted);}
  header .status{
    font-family:var(--mono);font-size:12px;color:var(--amber);
    border:1px solid var(--amber-dim);background:rgba(224,162,75,0.08);
    padding:5px 10px;border-radius:3px;
  }
  header .status.closed{color:var(--teal);border-color:var(--teal-dim);background:rgba(79,176,165,0.1);}
  .resetbtn{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    background:transparent;border:1px solid var(--line);padding:5px 9px;border-radius:3px;cursor:pointer;
  }
  .resetbtn:hover{color:var(--text);border-color:var(--muted);}

  .layout{display:grid;grid-template-columns:380px 1fr;gap:22px;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}

  .phase-head{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    text-transform:none;margin:18px 0 8px 2px;
  }
  .phase-head:first-child{margin-top:0;}

  .stepper{display:flex;flex-direction:column;gap:8px;}
  .step{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px 14px;transition:border-color .2s ease, background .2s ease;}
  .step.locked{opacity:0.4;}
  .step.active{border-color:var(--amber-dim);background:var(--panel-2);}
  .step.done{border-color:var(--teal-dim);}
  .step-top{display:flex;align-items:center;gap:9px;margin-bottom:2px;}
  .step-num{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--muted);flex-shrink:0;}
  .step.active .step-num{border-color:var(--amber);color:var(--amber);}
  .step.done .step-num{border-color:var(--teal);color:var(--teal);background:rgba(79,176,165,0.12);}
  .step-label{font-size:13px;font-weight:600;}
  .step-answer{font-family:var(--mono);font-size:12px;color:var(--teal);margin:6px 0 0 29px;word-break:break-all;}
  .step-mitre{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin:4px 0 0 29px;}

  .qpanel{margin-top:8px;}
  .qpanel p{font-size:13.5px;line-height:1.5;color:var(--text);margin:0 0 12px 0;}
  .inputrow{display:flex;gap:8px;}
  input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 10px;border-radius:3px;}
  input[type=text]:focus{outline:none;border-color:var(--amber);}
  button{font-family:var(--sans);font-size:13px;font-weight:600;padding:9px 14px;border-radius:3px;border:1px solid var(--amber-dim);background:var(--amber);color:#1A1305;cursor:pointer;}
  button:hover{filter:brightness(1.08);}
  .hintbtn{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:12px;margin-top:8px;padding:5px 10px;}
  .hintbtn:hover{color:var(--text);border-color:var(--muted);}
  .hint{font-size:12.5px;color:var(--muted);border-left:2px solid var(--amber-dim);padding:8px 10px;margin-top:8px;background:rgba(224,162,75,0.05);display:none;}
  .reveal{font-size:11.5px;color:var(--amber);cursor:pointer;text-decoration:underline;display:inline-block;margin-top:6px;}
  .feedback{font-size:12.5px;margin-top:8px;display:none;}
  .feedback.wrong{color:var(--red);}
  .feedback.right{color:var(--teal);}

  .resolution{border:1px solid var(--teal-dim);background:rgba(79,176,165,0.06);border-radius:4px;padding:18px;margin-top:4px;}
  .resolution h3{margin:0 0 10px 0;font-size:14px;color:var(--teal);}
  .chain{font-family:var(--mono);font-size:11.5px;color:var(--text);line-height:1.85;margin:0 0 12px 0;}
  .resolution p{font-size:13px;line-height:1.6;color:var(--muted);margin:0;}

  .tablewrap{border:1px solid var(--line);background:var(--panel);border-radius:4px;overflow:hidden;position:sticky;top:20px;}
  .tabletop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .tabletop .lbl{font-size:12px;color:var(--muted);font-family:var(--mono);}
  .search{background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:12.5px;padding:7px 10px;border-radius:3px;width:220px;}
  .search:focus{outline:none;border-color:var(--amber);}
  .tablescroll{max-height:calc(100vh - 120px);overflow:auto;}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;}
  th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:9px 10px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:7px 10px;border-bottom:1px solid rgba(42,49,61,0.6);color:var(--text);white-space:nowrap;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .hash-cell{color:var(--amber);}
  .dim{color:var(--muted);}
  .empty-row td{color:var(--muted);text-align:center;padding:20px;font-family:var(--sans);}
</style>

function normalize(s){
  return String(s).trim().toLowerCase().replace(/^https?:\/\//,"").replace(/\/$/,"");
}
function matches(input, answers){
  const n = normalize(input);
  return answers.some(a => normalize(a) === n);
}

function renderStepper(){
  const el = document.getElementById('stepper');
  el.innerHTML = "";
  let lastPhase = null;

  steps.forEach((s,i)=>{
    if(s.phase !== lastPhase){
      const h = document.createElement('div');
      h.className = "phase-head";
      h.textContent = s.phase;
      el.appendChild(h);
      lastPhase = s.phase;
    }

    const isDone = solved[i];
    const isActive = !isDone && (i===0 || solved[i-1]);

    const div = document.createElement('div');
    div.className = "step " + (isDone?"done":isActive?"active":"locked");

    let inner = `<div class="step-top">
        <div class="step-num">${isDone?"✓":i+1}</div>
        <div class="step-label">${s.label}</div>
      </div>`;

    if(isDone){
      inner += `<div class="step-answer">${s.userAnswer}</div>`;
      if(s.mitre){
        inner += `<div class="step-mitre">${s.mitre}</div>`;
      }
    } else if(isActive){
      inner += `<div class="qpanel">
        <p>${s.prompt}</p>
        <div class="inputrow">
          <input type="text" id="input-${i}" placeholder="${s.placeholder}">
          <button onclick="submitStep(${i})">Check</button>
        </div>
        <div class="feedback" id="fb-${i}"></div>
        <button class="hintbtn" onclick="toggleHint(${i})">Need a hint?</button>
        <div class="hint" id="hint-${i}">
          ${s.hint}
          <br><span class="reveal" onclick="revealAnswer(${i})">Show the answer</span>
        </div>
      </div>`;
    } else {
      inner += `<div style="font-size:11px;color:var(--muted);margin-left:29px;">🔒 locked until the previous step is solved</div>`;
    }

    div.innerHTML = inner;
    el.appendChild(div);

    if(isActive){
      const input = document.getElementById(`input-${i}`);
      input.addEventListener('keydown', (e)=>{ if(e.key==="Enter") submitStep(i); });
    }
  });

  document.getElementById('progress').textContent = `${solved.filter(Boolean).length} / ${steps.length} confirmed`;

  if(solved.every(x=>x)){
    const div = document.createElement('div');
    div.className = "resolution";
    div.innerHTML = `
      <h3>Case closed — full chain</h3>
      <div class="chain">
        FIN-WKS-014 (Q3_invoice.docm) → T1566.001 Phishing Attachment
        <br>&nbsp;&nbsp;→ T1059.001 PowerShell (T1027 encoded — decodes to a call-out to 185.215.113.117)
        <br>&nbsp;&nbsp;→ Dropped file, hash tied to PureLogStealer
        <br>&nbsp;&nbsp;→ C2 beacon: winyardbuilding.nz (T1071.001)
        <br>&nbsp;&nbsp;→ T1053.005 Scheduled Task persistence (WinUpdateCheck)
        <br>&nbsp;&nbsp;→ T1003.001 LSASS Memory dump (comsvcs.exe) — exposed svc-backup's cached
        credentials from its local backup_agent.exe session
        <br>&nbsp;&nbsp;→ T1078 svc-backup account reused
        <br>&nbsp;&nbsp;→ T1021.002 Lateral movement to HQ-FILESVR-01 (PsExec)
        <br>&nbsp;&nbsp;→ T1560.001 Archive staged (Finance_Q3_Archive.zip)
        <br>&nbsp;&nbsp;→ T1041 Exfiltration to 185.215.113.117 — the same address the encoded
        command reached out to at the very start
      </div>
      <p>Recommended containment: isolate FIN-WKS-014 and HQ-FILESVR-01, reset svc-backup credentials,
      block both external destinations, and hunt across the rest of the estate for the same hash or IOCs.
      <br><br>This is what a lead-driven hunt looks like end to end: an external indicator, pivoted into
      your own environment, resolved into a concrete, ATT&CK-mapped hypothesis.</p>
    `;
    el.appendChild(div);
    document.getElementById('statusBadge').textContent = "CASE CLOSED";
    document.getElementById('statusBadge').classList.add('closed');
  } else {
    document.getElementById('statusBadge').textContent = "INVESTIGATION OPEN";
    document.getElementById('statusBadge').classList.remove('closed');
  }
}

function submitStep(i){
  const input = document.getElementById(`input-${i}`);
  const fb = document.getElementById(`fb-${i}`);
  fb.style.display = "block";
  if(matches(input.value, steps[i].answer)){
    steps[i].userAnswer = input.value.trim();
    solved[i] = true;
    fb.className = "feedback right";
    fb.textContent = "Confirmed.";
    setTimeout(renderStepper, 250);
  } else {
    fb.className = "feedback wrong";
    fb.textContent = "Not quite — check the table again, or use the hint.";
  }
}

function toggleHint(i){
  const h = document.getElementById(`hint-${i}`);
  h.style.display = h.style.display === "block" ? "none" : "block";
}

function revealAnswer(i){
  const input = document.getElementById(`input-${i}`);
  input.value = steps[i].answer[0];
}

function resetCase(){
  solved = new Array(steps.length).fill(false);
  steps.forEach(s=>{ delete s.userAnswer; });
  renderStepper();
}

function renderTable(filter){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = "";
  const f = (filter||"").toLowerCase();
  let shown = 0;
  rows.forEach(r=>{
    if(f && !r.some(c => String(c).toLowerCase().includes(f))) return;
    shown++;
    const tr = document.createElement('tr');
    tr.innerHTML = r.map((c,idx)=>{
      if(idx===7 && c!=="-") return `<td class="hash-cell">${c}</td>`;
      if(c==="-") return `<td class="dim">-</td>`;
      return `<td>${c}</td>`;
    }).join("");
    tbody.appendChild(tr);
  });
  if(shown===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No matching events.</td></tr>`;
  }
}

document.getElementById('search').addEventListener('input', (e)=> renderTable(e.target.value));
document.getElementById('rowCount').textContent = rows.length;

renderStepper();
renderTable("");
</script>
</body>
</html>
