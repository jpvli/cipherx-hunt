  header h1{font-size:22px;font-weight:600;margin:4px 0 0 0;}
  header .search{

  }
  header .search:focus{outline:none;border-color:var(--amber);}

  .tablewrap{border:1px solid var(--line);background:var(--panel);border-radius:4px;}
  .tabletop{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .tabletop .lbl{font-size:12px;color:var(--muted);font-family:var(--mono);}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;}
  th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:11px 14px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:9px 14px;border-bottom:1px solid rgba(42,49,61,0.6);color:var(--text);white-space:nowrap;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .hash-cell{color:var(--amber);}
  .dim{color:var(--muted);}
  .empty-row td{color:var(--muted);text-align:center;padding:20px;font-family:var(--sans);}
</style>

function renderTable(filter){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = "";
  const f = (filter||"").toLowerCase();
  let shown = 0;
  rows.forEach(r=>{
    if(f && !r.some(c => String(c).toLowerCase().includes(f))) return;
    shown++;
    const tr = document.createElement('tr');
    tr.innerHTML = r.map((c,idx)=>{
      if(idx===7 && c!=="-") return `<td class="hash-cell">${c}</td>`;
      if(c==="-") return `<td class="dim">-</td>`;
      return `<td>${c}</td>`;
    }).join("");
    tbody.appendChild(tr);
  });
  if(shown===0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No matching events.</td></tr>`;
  }
}
